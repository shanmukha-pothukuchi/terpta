<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet"><style>body{margin:0;background:#0B0B0E}a{color:#EDEDEF}a:hover{color:#fff}</style></helmet>
<div style="width:208px;height:100%;min-height:600px;background:#0F0F13;border-right:1px solid rgba(255,255,255,0.08);display:flex;flex-direction:column;padding:14px 10px 16px;gap:2px;box-sizing:border-box;font-family:Geist,system-ui,sans-serif;color:#EDEDEF">
  <div style="display:flex;align-items:center;gap:8px;padding:4px 8px 16px">
    <div style="width:8px;height:8px;border-radius:50%;background:#E21833;box-shadow:0 0 10px rgba(226,24,51,0.6)"></div>
    <div style="font-size:14px;font-weight:600;letter-spacing:-0.02em">TerpTA</div>
  </div>
  <sc-if value="{{ isTA }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;flex-direction:column;gap:2px">
      <div style="display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:8px;font-size:13px;cursor:pointer;transition:background 150ms,color 150ms;color:{{ av.c }};background:{{ av.bg }}" style-hover="background:rgba(255,255,255,0.06);color:#EDEDEF"><svg width="16" height="16" viewBox="0 0 24 24" style="fill:none;stroke:{{ av.ic }};stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path><path d="m9 16 2 2 4-4"></path></svg>Availability</div>
      <div style="display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:8px;font-size:13px;cursor:pointer;transition:background 150ms,color 150ms;color:{{ sc.c }};background:{{ sc.bg }}" style-hover="background:rgba(255,255,255,0.06);color:#EDEDEF"><svg width="16" height="16" viewBox="0 0 24 24" style="fill:none;stroke:{{ sc.ic }};stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path><path d="M8 14h.01"></path><path d="M12 14h.01"></path><path d="M16 14h.01"></path><path d="M8 18h.01"></path><path d="M12 18h.01"></path><path d="M16 18h.01"></path></svg>My Schedule</div>
      <div style="display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:8px;font-size:13px;cursor:pointer;transition:background 150ms,color 150ms;color:{{ hr.c }};background:{{ hr.bg }}" style-hover="background:rgba(255,255,255,0.06);color:#EDEDEF"><svg width="16" height="16" viewBox="0 0 24 24" style="fill:none;stroke:{{ hr.ic }};stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>Hours</div>
      <div style="display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:8px;font-size:13px;cursor:pointer;transition:background 150ms,color 150ms;color:{{ pr.c }};background:{{ pr.bg }}" style-hover="background:rgba(255,255,255,0.06);color:#EDEDEF"><svg width="16" height="16" viewBox="0 0 24 24" style="fill:none;stroke:{{ pr.ic }};stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none"><line x1="21" x2="14" y1="4" y2="4"></line><line x1="10" x2="3" y1="4" y2="4"></line><line x1="21" x2="12" y1="12" y2="12"></line><line x1="8" x2="3" y1="12" y2="12"></line><line x1="21" x2="16" y1="20" y2="20"></line><line x1="12" x2="3" y1="20" y2="20"></line><line x1="14" x2="14" y1="2" y2="6"></line><line x1="8" x2="8" y1="10" y2="14"></line><line x1="16" x2="16" y1="18" y2="22"></line></svg>Preferences</div>
    </div>
  </sc-if>
  <sc-if value="{{ isCoord }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;gap:2px">
      <div style="display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:8px;font-size:13px;cursor:pointer;transition:background 150ms,color 150ms;color:{{ ro.c }};background:{{ ro.bg }}" style-hover="background:rgba(255,255,255,0.06);color:#EDEDEF"><svg width="16" height="16" viewBox="0 0 24 24" style="fill:none;stroke:{{ ro.ic }};stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>Roster</div>
      <div style="display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:8px;font-size:13px;cursor:pointer;transition:background 150ms,color 150ms;color:{{ dt.c }};background:{{ dt.bg }}" style-hover="background:rgba(255,255,255,0.06);color:#EDEDEF"><svg width="16" height="16" viewBox="0 0 24 24" style="fill:none;stroke:{{ dt.ic }};stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"></path><circle cx="7.5" cy="7.5" r=".5"></circle></svg>Duty Types</div>
      <div style="display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:8px;font-size:13px;cursor:pointer;transition:background 150ms,color 150ms;color:{{ sh.c }};background:{{ sh.bg }}" style-hover="background:rgba(255,255,255,0.06);color:#EDEDEF"><svg width="16" height="16" viewBox="0 0 24 24" style="fill:none;stroke:{{ sh.ic }};stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none"><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M16 2v4"></path><path d="M3 10h18"></path><path d="M8 2v4"></path><path d="M17 14h-6"></path><path d="M13 18H7"></path><path d="M7 14h.01"></path><path d="M17 18h.01"></path></svg>Shifts</div>
      <div style="display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:8px;font-size:13px;cursor:pointer;transition:background 150ms,color 150ms;color:{{ bu.c }};background:{{ bu.bg }}" style-hover="background:rgba(255,255,255,0.06);color:#EDEDEF"><svg width="16" height="16" viewBox="0 0 24 24" style="fill:none;stroke:{{ bu.ic }};stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none"><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72"></path><path d="m14 7 3 3"></path><path d="M5 6v4"></path><path d="M19 14v4"></path><path d="M10 2v2"></path><path d="M7 8H3"></path><path d="M21 16h-4"></path><path d="M11 3H9"></path></svg>Builder</div>
      <div style="display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:8px;font-size:13px;cursor:pointer;transition:background 150ms,color 150ms;color:{{ ch.c }};background:{{ ch.bg }}" style-hover="background:rgba(255,255,255,0.06);color:#EDEDEF"><svg width="16" height="16" viewBox="0 0 24 24" style="fill:none;stroke:{{ ch.ic }};stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>Hours</div>
      <div style="display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:8px;font-size:13px;cursor:pointer;transition:background 150ms,color 150ms;color:{{ cl.c }};background:{{ cl.bg }}" style-hover="background:rgba(255,255,255,0.06);color:#EDEDEF"><svg width="16" height="16" viewBox="0 0 24 24" style="fill:none;stroke:{{ cl.ic }};stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l4 2"></path></svg>Changelog</div>
    </div>
  </sc-if>
  <div style="flex:1"></div>
  <div style="display:flex;align-items:center;gap:8px;padding:8px 8px 0;border-top:1px solid rgba(255,255,255,0.06);font-size:11px;color:#6B6B75;font-family:'Geist Mono',ui-monospace,monospace">{{ footer }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:208,&quot;height&quot;:720},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ta&quot;,&quot;coordinator&quot;],&quot;default&quot;:&quot;coordinator&quot;,&quot;tsType&quot;:&quot;'ta' | 'coordinator'&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Builder&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;footer&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Fall 2026 · Week 2&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const role = this.props.role ?? 'coordinator';
    const active = (this.props.active ?? '').toLowerCase();
    const on = { c: '#F4F4F5', ic: '#E21833', bg: 'rgba(255,255,255,0.06)' };
    const off = { c: '#9A9AA3', ic: '#6B6B75', bg: 'transparent' };
    const s = (k) => (active === k ? on : off);
    return {
      isTA: role === 'ta', isCoord: role !== 'ta',
      av: s('availability'), sc: s('my schedule'), hr: s('hours'), pr: s('preferences'),
      ro: s('roster'), dt: s('duty types'), sh: s('shifts'), bu: s('builder'), ch: s('hours'), cl: s('changelog'),
      footer: this.props.footer ?? 'Fall 2026 · Week 2',
    };
  }
}
</script>
</body>
</html>
